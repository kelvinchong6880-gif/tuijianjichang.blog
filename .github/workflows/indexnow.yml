name: Notify IndexNow (Bing) on new content

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run build

      - name: Submit sitemap URLs to IndexNow
        run: node scripts/submit-indexnow.js
